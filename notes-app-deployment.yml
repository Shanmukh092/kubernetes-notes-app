apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: notes-app

  template:
    metadata:
      labels:
        app: notes-app

    spec:
      containers:
      - name: notes-app
        image: pritham07/notes-app:v1

        ports:
          - containerPort: 80
